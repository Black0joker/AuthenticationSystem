services:
  api:
    build:
      context: .
      dockerfile: src/IdentityAuth.Api/Dockerfile
    container_name: identityauth-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=IdentityAuthDb;User Id=sa;Password=${SQLSERVER_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-ProductionSuperSecretKeyThatIsAtLeast32CharactersLong!}
      - JwtSettings__Issuer=IdentityAuthServer
      - JwtSettings__Audience=IdentityAuthClient
      - JwtSettings__AccessTokenExpirationMinutes=15
      - Database__AutoMigrate=true
      - Database__AutoSeed=true
      - RateLimiting__Enabled=true
      - Cors__AllowedOrigins__0=http://localhost:3000
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - identityauth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: identityauth-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQLSERVER_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - identityauth-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_PASSWORD:-YourStrong!Passw0rd}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data:

networks:
  identityauth-network:
    driver: bridge
